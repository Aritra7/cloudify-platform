name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cloudify
          POSTGRES_PASSWORD: cloudify
          POSTGRES_DB: cloudify_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cloudify -d cloudify_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CLOUDIFY_TEST_DATABASE_URL: postgres://cloudify:cloudify@localhost:5432/cloudify_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -o /tmp/terraform-provider-cloudify ./cmd/terraform-provider-cloudify
      - run: go build -o /tmp/cloudify-operator ./cmd/cloudify-operator

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false
      - uses: azure/setup-helm@v4
      - run: terraform fmt -check -recursive internal/iac/modules
      - run: terraform fmt -check -recursive examples/terraform-provider
      - run: terraform -chdir=internal/iac/modules/cloud-run init -backend=false
      - run: terraform -chdir=internal/iac/modules/cloud-run validate
      - run: helm lint deploy/helm/cloudify-operator
      - run: go test ./internal/provider -run '^TestAcc' -v
        env:
          TF_ACC: "1"
