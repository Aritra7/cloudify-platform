apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-cloudify-operator
  labels: { app.kubernetes.io/name: cloudify-operator }
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-cloudify-operator
rules:
  - apiGroups: ["cloudify.dev"]
    resources: ["migrations"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["cloudify.dev"]
    resources: ["migrations/status", "migrations/finalizers"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-cloudify-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-cloudify-operator
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-cloudify-operator
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-cloudify-operator
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: { app.kubernetes.io/name: cloudify-operator }
  template:
    metadata:
      labels: { app.kubernetes.io/name: cloudify-operator }
    spec:
      serviceAccountName: {{ .Release.Name }}-cloudify-operator
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: operator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--leader-elect=true"]
          env:
            - name: CLOUDIFY_ENDPOINT
              value: {{ .Values.controlPlane.endpoint | quote }}
            - name: CLOUDIFY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.controlPlane.tokenSecretName }}
                  key: {{ .Values.controlPlane.tokenSecretKey }}
          ports:
            - { name: metrics, containerPort: 8080 }
            - { name: health, containerPort: 8081 }
          readinessProbe: { httpGet: { path: /readyz, port: health } }
          livenessProbe: { httpGet: { path: /healthz, port: health } }
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
            runAsNonRoot: true
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-cloudify-operator
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: cloudify-operator }
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - { protocol: TCP, port: 8080 }
        - { protocol: TCP, port: 8081 }
  egress:
    - ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 443 }
